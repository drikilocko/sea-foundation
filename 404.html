<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102d50">
  <meta name="robots" content="noindex">
  <title>Page introuvable — SEA Foundation</title>
  <link rel="icon" type="image/png" href="/asset/3.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .not-found { width: min(620px, 100%); padding: clamp(32px, 7vw, 64px); border: 1px solid rgba(255,255,255,.62); border-radius: 24px; background: #102d50; color: white; text-align: center; }
    .not-found .sea-logo-fill { position: relative; display: block; width: 150px; height: 140px; margin-inline: auto; overflow: hidden; }
    .not-found .sea-logo-fill img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .not-found .sea-logo-fill__color { clip-path: inset(100% 0 0); animation: sea-logo-fill 1.35s cubic-bezier(.22, 1, .36, 1) .18s both; }
    @keyframes sea-logo-fill { to { clip-path: inset(0); } }
    @media (prefers-reduced-motion: reduce) { .not-found .sea-logo-fill__color { clip-path: inset(0); animation: none; } }
    .not-found h1 { margin: 22px 0 0; font-family: Manrope, sans-serif; font-size: clamp(48px, 10vw, 84px); line-height: 1; letter-spacing: -.06em; }
    .not-found p { margin: 16px 0 26px; color: rgba(255,255,255,.82); line-height: 1.7; }
  </style>
</head>
<body>
  <main class="not-found">
    <span class="sea-logo-fill" role="img" aria-label="SEA Foundation"><img class="sea-logo-fill__base" src="/asset/1.png" alt="" aria-hidden="true"><img class="sea-logo-fill__color" src="/asset/3.png" alt="" aria-hidden="true"></span>
    <h1>404</h1>
    <p>Cette page n’existe pas ou a été déplacée.</p>
    <a class="button button-light" href="/">Retour à l’accueil <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></span></a>
  </main>
  <script>
    try {
      if (localStorage.getItem("sea-foundation-language") === "en") {
        document.documentElement.lang = "en";
        document.title = "Page not found — SEA Foundation";
        document.querySelector(".not-found p").textContent = "This page does not exist or has been moved.";
        document.querySelector(".not-found a").firstChild.textContent = "Back to home ";
      }
    } catch (error) {
      console.error("Unable to read the saved site language.", error);
    }
  </script>
</body>
</html>
