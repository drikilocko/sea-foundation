<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102d50">
  <meta name="robots" content="noindex">
  <title>Page introuvable — SEA Foundation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .not-found { width: min(620px, 100%); padding: clamp(32px, 7vw, 64px); border: 1px solid rgba(255,255,255,.62); border-radius: 24px; background: #102d50; color: white; text-align: center; }
    .not-found img { width: 96px; height: 110px; object-fit: contain; }
    .not-found h1 { margin: 22px 0 0; font-family: Manrope, sans-serif; font-size: clamp(48px, 10vw, 84px); line-height: 1; letter-spacing: -.06em; }
    .not-found p { margin: 16px 0 26px; color: rgba(255,255,255,.82); line-height: 1.7; }
  </style>
</head>
<body>
  <main class="not-found">
    <img src="/asset/logo1.png" alt="SEA Foundation">
    <h1>404</h1>
    <p>Cette page n’existe pas ou a été déplacée.</p>
    <a class="button button-light" href="/">Retour à l’accueil <span class="arrow" aria-hidden="true">↗</span></a>
  </main>
  <script>
    try {
      if (localStorage.getItem("sea-foundation-language") === "en") {
        document.documentElement.lang = "en";
        document.title = "Page not found — SEA Foundation";
        document.querySelector(".not-found p").textContent = "This page does not exist or has been moved.";
        document.querySelector(".not-found a").firstChild.textContent = "Back to home ";
      }
    } catch (error) {
      console.error("Unable to read the saved site language.", error);
    }
  </script>
</body>
</html>
